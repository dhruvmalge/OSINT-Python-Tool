{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width: 440px; margin: 50px auto; text-align: center;">
  <h2>Password Protected Link</h2>
  <p class="muted">This link requires a password to proceed to <strong>{{ link.title }}</strong>.</p>
  
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Enter Password
      <input type="password" name="link_password" placeholder="Enter link password" required autofocus>
    </label>
    <button type="submit" style="width: 100%;">Unlock & Continue</button>
  </form>
</div>
{% endblock %}
